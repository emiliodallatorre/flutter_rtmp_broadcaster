org.gradle.jvmargs=-Xmx4096M -XX:MaxMetaspaceSize=2048M
android.useAndroidX=true
android.enableJetifier=true
# AGP 9.3.1's built-in Kotlin is pinned to 2.2.10, which is older than the
# minimum Kotlin version (2.2.20) required by Flutter's Gradle plugin. AGP
# 9.4 (which bundles 2.2.20) is alpha-only, so built-in Kotlin is opted out
# here in favor of an explicit, newer kotlin-android plugin version. Remove
# this once a stable AGP release ships with Kotlin >= 2.2.20 built in.
android.builtInKotlin=false
# Flutter's own Gradle plugin isn't fully compatible with AGP 9's new DSL
# yet, so this compatibility flag (added automatically by Flutter tooling)
# must stay until Flutter migrates. Not related to the Kotlin version fix
# above.
android.newDsl=false
