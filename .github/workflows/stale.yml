name: Close stale issues and pull requests

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - name: Auto-close issues labeled status:fixed after 2 weeks
        uses: actions/stale@v9
        with:
          only-issue-labels: 'status:fixed'
          days-before-issue-stale: 0
          days-before-issue-close: 14
          days-before-pr-stale: -1
          days-before-pr-close: -1
          stale-issue-label: 'stale'
          remove-stale-when-updated: true
          stale-issue-message: >
            This issue is labeled `status:fixed` and has had no further
            activity. It will be closed in 14 days if no further activity
            occurs.
          close-issue-message: >
            This issue was closed because it is labeled `status:fixed` and
            has had no further activity for 14 days.

      - name: Close stale issues and pull requests
        uses: actions/stale@v9
        with:
          days-before-stale: 60
          days-before-close: 14
          exempt-issue-labels: 'pinned,enhancement,status:fixed'
          exempt-pr-labels: 'pinned,enhancement'
          stale-issue-label: 'stale'
          stale-pr-label: 'stale'
          stale-issue-message: >
            This issue has been automatically marked as stale because it has
            not had recent activity. It will be closed in 14 days if no
            further activity occurs. Thank you for your contributions.
          stale-pr-message: >
            This pull request has been automatically marked as stale because
            it has not had recent activity. It will be closed in 14 days if
            no further activity occurs. Thank you for your contributions.
          close-issue-message: >
            This issue was closed because it has been stale for 14 days with
            no further activity.
          close-pr-message: >
            This pull request was closed because it has been stale for 14
            days with no further activity.
