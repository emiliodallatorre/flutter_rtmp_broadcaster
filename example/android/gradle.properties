org.gradle.jvmargs=-Xmx4096M -XX:MaxMetaspaceSize=2048M
android.useAndroidX=true
android.enableJetifier=true
# AGP's built-in Kotlin support compiles this app's Kotlin sources
# directly, without applying an explicit kotlin-android plugin. See
# https://docs.flutter.dev/release/breaking-changes/migrate-to-built-in-kotlin/for-app-developers.
android.builtInKotlin=true
# Flutter's own Gradle plugin isn't fully compatible with AGP 9's new DSL
# yet, so this compatibility flag (added automatically by Flutter tooling)
# must stay until Flutter migrates. Not related to the Kotlin version fix
# above.
android.newDsl=false
