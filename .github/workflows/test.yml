name: Dart CI

on:
  push:
  pull_request:
    branches: [ master ]

env:
  JAVA_VERSION: '17'

jobs:
  analyze:
    name: Analyze (dart analyze)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      - run: flutter pub get
      - run: dart analyze

  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true
      - name: Cache Gradle
        if: startsWith(matrix.os, 'ubuntu')
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('example/android/**/*.gradle*', 'android/**/*.gradle*') }}
      - name: Cache CocoaPods
        if: startsWith(matrix.os, 'macos')
        uses: actions/cache@v6
        with:
          path: |
            ~/Library/Caches/CocoaPods
            example/ios/Pods
          key: ${{ runner.os }}-pods-${{ hashFiles('example/ios/Podfile.lock') }}
      - run: dart --version
      - run: flutter --version
      - run: flutter pub get
      - run: flutter test --exclude-tags=api-consistency
      - name: Check public API consistency against 2.3.4
        run: flutter test --tags=api-consistency
        continue-on-error: true
      - name: Build example Android APK (also lints the plugin's Kotlin sources)
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          flutter build apk --debug
          cd android && ./gradlew :rtmp_broadcaster:lintDebug
        working-directory: example
      - name: Build example iOS app (also compiles the plugin's Swift/Obj-C sources)
        if: startsWith(matrix.os, 'macOS')
        run: flutter build ios --debug --no-codesign
        working-directory: example

  coverage:
    name: Report coverage
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true
      - run: flutter pub get
      - run: flutter test --coverage
        continue-on-error: true
      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: lcov.info
          path: coverage/lcov.info
      - name: Upload coverage to Codecov
        if: hashFiles('coverage/lcov.info') != ''
        uses: codecov/codecov-action@v7
        with:
          files: coverage/lcov.info
          use_oidc: true
