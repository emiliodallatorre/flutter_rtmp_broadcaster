name: Dart CI

on:
  push:
    branches: [ master, features/modernizing ]
  pull_request:
    branches: [ master ]

env:
  FLUTTER_VERSION: 3.44.9
  JAVA_VERSION: '17'

jobs:
  analyze:
    name: Analyze (dart analyze)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true
      - run: flutter pub get
      - run: dart analyze

  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true
      - name: Cache Gradle
        if: startsWith(matrix.os, 'ubuntu')
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('example/android/**/*.gradle*', 'android/**/*.gradle*') }}
      - name: Cache CocoaPods
        if: startsWith(matrix.os, 'macOS')
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/CocoaPods
            example/ios/Pods
          key: ${{ runner.os }}-pods-${{ hashFiles('example/ios/Podfile.lock') }}
      - run: dart --version
      - run: flutter --version
      - run: flutter pub get
      - run: flutter test
      - name: Build example Android APK (also lints the plugin's Kotlin sources)
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          flutter build apk --debug
          cd android && ./gradlew :rtmp_broadcaster:lintDebug
        working-directory: example
      - name: Build example iOS app (also compiles the plugin's Swift/Obj-C sources)
        if: startsWith(matrix.os, 'macOS')
        run: flutter build ios --debug --no-codesign
        working-directory: example
