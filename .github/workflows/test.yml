name: Dart CI

on:
  push:
  pull_request:
    branches: [ master ]

env:
  JAVA_VERSION: '17'

jobs:
  analyze:
    name: Analyze (dart analyze)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      - run: flutter pub get
      - run: dart analyze

  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true
      - name: Cache Gradle
        if: startsWith(matrix.os, 'ubuntu')
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('example/android/**/*.gradle*', 'android/**/*.gradle*') }}
      - name: Cache CocoaPods
        if: startsWith(matrix.os, 'macOS')
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/CocoaPods
            example/ios/Pods
          key: ${{ runner.os }}-pods-${{ hashFiles('example/ios/Podfile.lock') }}
      - run: dart --version
      - run: flutter --version
      - run: flutter pub get
      - run: flutter test --exclude-tags=api-consistency
      - name: Check public API consistency against 2.3.4
        run: flutter test --tags=api-consistency
        continue-on-error: true
      - name: Build example Android APK (also lints the plugin's Kotlin sources)
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          flutter build apk --debug
          cd android && ./gradlew :rtmp_broadcaster:lintDebug
        working-directory: example
      - name: Build example iOS app (also compiles the plugin's Swift/Obj-C sources)
        if: startsWith(matrix.os, 'macOS')
        run: flutter build ios --debug --no-codesign
        working-directory: example

  coverage:
    name: Report coverage
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true
      - run: flutter pub get
      - run: flutter test --coverage
        continue-on-error: true
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: lcov.info
          path: coverage/lcov.info
      - name: Report coverage on pull request
        if: github.event_name == 'pull_request'
        uses: zgosalvez/github-actions-report-lcov@v4
        with:
          coverage-files: coverage/lcov.info
          github-token: ${{ secrets.GITHUB_TOKEN }}
          update-comment: true
